name: Release native binaries

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Detect package release
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.package.outputs.changed }}
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect package version change
        id: package
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process"
          import { appendFileSync, readFileSync } from "node:fs"

          const current = JSON.parse(readFileSync("package.json", "utf8")).version
          const previous = JSON.parse(
            execFileSync("git", ["show", `${process.env.BEFORE_SHA}:package.json`], {
              encoding: "utf8",
            }),
          ).version

          appendFileSync(process.env.GITHUB_OUTPUT, `changed=${current !== previous}\n`)
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${current}\n`)
          NODE

  verify:
    name: Verify source
    needs: metadata
    if: needs.metadata.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Install development dependencies
        run: bun install --frozen-lockfile

      - name: Run static checks
        run: bun run check

      - name: Run unit tests
        run: cargo test --locked

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.architecture }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux
            architecture: x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux
            architecture: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin
            architecture: x64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: darwin
            architecture: arm64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: win32
            architecture: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: win32
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build native binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Assemble release assets
        run: node scripts/package-release.mjs ${{ matrix.target }} ${{ matrix.platform }} ${{ matrix.architecture }}

      - name: Upload release assets
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: omp-launchpad-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs:
      - metadata
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download native assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Assemble universal npm package
        run: node scripts/assemble-npm-package.mjs

      - name: Preserve npm package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: omp-launchpad-npm
          path: npm-dist/omp-launchpad.tgz
          if-no-files-found: error

      - name: Generate checksums
        working-directory: dist
        run: sha256sum omp-launchpad-* > SHA256SUMS

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG"

  publish:
    name: Publish npm package
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install trusted-publishing npm client
        run: npm install --global npm@11.19.1

      - name: Download npm package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: omp-launchpad-npm
          path: npm-dist

      - name: Publish npm package
        run: npm publish ./npm-dist/omp-launchpad.tgz --access public
