name: Release native binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install development dependencies
        run: bun install --frozen-lockfile

      - name: Run static checks
        run: bun run check

      - name: Run unit tests
        run: cargo test --locked

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.architecture }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            architecture: x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            architecture: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin
            architecture: x64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: darwin
            architecture: arm64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: win32
            architecture: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: win32
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build native binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble release assets
        run: node scripts/package-release.mjs ${{ matrix.target }} ${{ matrix.platform }} ${{ matrix.architecture }}

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: omp-launchpad-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download native assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum omp-launchpad-* > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --verify-tag
          fi
